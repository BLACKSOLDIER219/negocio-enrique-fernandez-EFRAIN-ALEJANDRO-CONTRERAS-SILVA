<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador Pokémon - WEB III</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: system-ui, Arial, sans-serif; color: #172033;
      background: linear-gradient(135deg, #e8f2ff, #f7f9fc);
    }
    main {
      max-width: 650px; margin: auto; padding: 28px;
      background: white; border-radius: 18px;
      box-shadow: 0 12px 35px #17203318;
    }
    h1 { margin-top: 0; }
    form { display: flex; gap: 10px; flex-wrap: wrap; }
    input {
      flex: 1; min-width: 180px; padding: 12px;
      border: 1px solid #b8c2d3; border-radius: 9px; font-size: 1rem;
    }
    button {
      padding: 12px 18px; border: 0; border-radius: 9px;
      background: #2457c5; color: white; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 28px; margin-top: 18px; }
    .error { color: #b42318; }
    .loading { color: #2457c5; }
    .pokemon { margin-top: 20px; text-align: center; }
    .pokemon img { width: 190px; height: 190px; object-fit: contain; }
    .types { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .type { background: #e8efff; padding: 6px 12px; border-radius: 99px; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
    dl div { background: #f5f7fb; padding: 12px; border-radius: 9px; }
    dt { color: #586174; font-size: .9rem; }
    dd { margin: 4px 0 0; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Buscador de Pokémon</h1>
    <p>Escribe el nombre o número de un Pokémon para consultar la PokeAPI.</p>
    <form id="search-form">
      <input id="pokemon-name" name="pokemon" placeholder="Ej.: pikachu" autocomplete="off" required>
      <button id="search-button" type="submit">Buscar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" aria-label="Información del Pokémon"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
